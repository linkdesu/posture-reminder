name: PostureLab
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  PostureLab:
    type: application
    postBuildScripts:
      # 把当前 commit 写进 bundle：日志第一行要能回答「这是哪个构建」。构建目录里跑 git 即可，
      # 不在源文件里写死 hash。
      - name: GitCommit
        script: |
          set -e
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GitCommit.txt"
          git -C "${SRCROOT}" rev-parse --short HEAD > "${DEST}"
        # 每次都重跑：否则增量构建会留下旧的 commit，日志首行就会撒谎。
        basedOnDependencyAnalysis: false
    platform: iOS
    sources: [PostureLab]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.xieal.posturelab.depth
        DEVELOPMENT_TEAM: DFA8MZ9MZW
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "用于在本机识别坐姿，画面不会显示、保存或上传"
        INFOPLIST_KEY_CFBundleDisplayName: "PostureLab"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.6.8"
        CURRENT_PROJECT_VERSION: "16"
  PostureLabTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PostureLabTests]
    dependencies:
      - target: PostureLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.xieal.posturelab.depth.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: DFA8MZ9MZW
  # The UI target exists for the two criteria a launch argument cannot express: AC2's ten
  # per-setting taps and AC12's manual pause. The dependency on the app is what gives the bundle its
  # TEST_TARGET_NAME, so `XCUIApplication()` launches PostureLab without naming it here.
  PostureLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PostureLabUITests]
    dependencies:
      - target: PostureLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.xieal.posturelab.depth.uitests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: DFA8MZ9MZW
schemes:
  PostureLab:
    build:
      targets:
        PostureLab: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PostureLabTests
        - PostureLabUITests
