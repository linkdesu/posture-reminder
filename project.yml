name: PostureLab
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  PostureLab:
    type: application
    postBuildScripts:
      # 把当前 commit 写进 bundle：日志第一行要能回答「这是哪个构建」。有 git 就用 git，不在源文件里
      # 写死 hash。Verification 的预检在无 .git 的快照里构建，那时依次读 GIT_COMMIT 与源码根的
      # .verify-commit（预检生成快照时写入）；三者都没有就构建失败——绝不写 unknown 冒充身份。
      - name: GitCommit
        script: |
          set -eu
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GitCommit.txt"
          commit=$(git -C "${SRCROOT}" rev-parse --short HEAD 2>/dev/null || true)
          if [ -z "${commit}" ]; then
            commit="${GIT_COMMIT:-}"
          fi
          if [ -z "${commit}" ] && [ -f "${SRCROOT}/.verify-commit" ]; then
            IFS= read -r commit < "${SRCROOT}/.verify-commit" || true
          fi
          if [ -z "${commit}" ]; then
            echo "error: GitCommit: 没有 git 仓库，也没有 GIT_COMMIT 环境变量或 ${SRCROOT}/.verify-commit" >&2
            echo "error: 无法确定本构建对应的 commit；预检快照应在生成时写入 .verify-commit" >&2
            exit 1
          fi
          printf '%s\n' "${commit}" > "${DEST}"
        # 每次都重跑：否则增量构建会留下旧的 commit，日志首行就会撒谎。
        basedOnDependencyAnalysis: false
    platform: iOS
    sources: [PostureLab]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.xieal.posturelab.depth
        DEVELOPMENT_TEAM: DFA8MZ9MZW
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "画面只在手机内存里处理，用于识别坐姿；不保存、不上传，也不显示摄像头画面"
        INFOPLIST_KEY_CFBundleDisplayName: "PostureLab"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.6.8"
        CURRENT_PROJECT_VERSION: "19"
  PostureLabTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PostureLabTests]
    dependencies:
      - target: PostureLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.xieal.posturelab.depth.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: DFA8MZ9MZW
  # The UI target exists for the two criteria a launch argument cannot express: AC2's ten
  # per-setting taps and AC12's manual pause. The dependency on the app is what gives the bundle its
  # TEST_TARGET_NAME, so `XCUIApplication()` launches PostureLab without naming it here.
  PostureLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PostureLabUITests]
    dependencies:
      - target: PostureLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.xieal.posturelab.depth.uitests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: DFA8MZ9MZW
schemes:
  PostureLab:
    build:
      targets:
        PostureLab: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PostureLabTests
        - PostureLabUITests
