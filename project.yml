name: PostureLab
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  PostureLab:
    type: application
    platform: iOS
    sources: [PostureLab]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.xieal.posturelab.vision
        DEVELOPMENT_TEAM: DFA8MZ9MZW
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "用于读取前置 TrueDepth 深度与彩色帧来估计阅读坐姿；彩色帧只在内存中交给 Vision 后立即丢弃，不显示、不保存，全部在本机处理"
        INFOPLIST_KEY_CFBundleDisplayName: "PostureLab Vision 版"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.4"
        CURRENT_PROJECT_VERSION: "4"
  PostureLabTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PostureLabTests]
    dependencies:
      - target: PostureLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.xieal.posturelab.vision.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: DFA8MZ9MZW
  # The UI target exists for the two criteria a launch argument cannot express: AC2's eleven
  # per-setting taps and AC12's manual pause. The dependency on the app is what gives the bundle its
  # TEST_TARGET_NAME, so `XCUIApplication()` launches PostureLab without naming it here.
  PostureLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PostureLabUITests]
    dependencies:
      - target: PostureLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.xieal.posturelab.vision.uitests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: DFA8MZ9MZW
schemes:
  PostureLab:
    build:
      targets:
        PostureLab: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PostureLabTests
        - PostureLabUITests
